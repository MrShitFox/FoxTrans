name: build-and-test

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            desktop_executable: FoxTrans.exe
            cli_executable: FoxTrans.Cli.exe
          - os: ubuntu-22.04
            rid: linux-x64
            desktop_executable: FoxTrans
            cli_executable: FoxTrans.Cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: dotnet restore FoxTrans.slnx --locked-mode
      - run: dotnet test FoxTrans.slnx --no-restore --configuration Release
      - name: Publish Desktop single-file artifact
        run: dotnet publish FoxTrans.Desktop/FoxTrans.Desktop.csproj --no-restore --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/release/${{ matrix.rid }}/desktop -p:TrimmerSingleWarn=false
      - name: Publish CLI single-file artifact
        run: dotnet publish FoxTrans.Cli/FoxTrans.Cli.csproj --no-restore --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/release/${{ matrix.rid }}/cli -p:TrimmerSingleWarn=false
      - name: Verify single-file artifacts and smoke-test CLI
        shell: pwsh
        run: |
          $desktopDirectory = "artifacts/release/${{ matrix.rid }}/desktop"
          $desktopExecutable = Join-Path $desktopDirectory "${{ matrix.desktop_executable }}"
          if (-not (Test-Path -LiteralPath $desktopExecutable -PathType Leaf)) {
            throw "Desktop executable is missing: $desktopExecutable"
          }

          if ("${{ matrix.rid }}" -like "win-*") {
            $desktopFiles = @(Get-ChildItem -LiteralPath $desktopDirectory -File)
            if ($desktopFiles.Count -ne 1 -or $desktopFiles[0].Name -ne "${{ matrix.desktop_executable }}") {
              throw "Expected only ${{ matrix.desktop_executable }} in $desktopDirectory, found: $($desktopFiles.Name -join ', ')"
            }
          }
          else {
            $linuxResources = @(
              "foxtrans.desktop.in",
              "install-desktop-entry.sh",
              "icons/hicolor/16x16/apps/foxtrans.png",
              "icons/hicolor/32x32/apps/foxtrans.png",
              "icons/hicolor/48x48/apps/foxtrans.png",
              "icons/hicolor/64x64/apps/foxtrans.png",
              "icons/hicolor/128x128/apps/foxtrans.png",
              "icons/hicolor/256x256/apps/foxtrans.png",
              "icons/hicolor/512x512/apps/foxtrans.png",
              "icons/hicolor/scalable/apps/foxtrans.svg"
            )

            foreach ($resource in $linuxResources) {
              if (-not (Test-Path -LiteralPath (Join-Path $desktopDirectory $resource) -PathType Leaf)) {
                throw "Linux desktop resource is missing: $resource"
              }
            }
          }

          $cliDirectory = "artifacts/release/${{ matrix.rid }}/cli"
          $cliFiles = @(Get-ChildItem -LiteralPath $cliDirectory -File)
          if ($cliFiles.Count -ne 1 -or $cliFiles[0].Name -ne "${{ matrix.cli_executable }}") {
            throw "Expected only ${{ matrix.cli_executable }} in $cliDirectory, found: $($cliFiles.Name -join ', ')"
          }

          & (Join-Path "artifacts/release/${{ matrix.rid }}/cli" "${{ matrix.cli_executable }}") --help
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed with exit code $LASTEXITCODE." }
      - uses: actions/upload-artifact@v4
        with:
          name: FoxTrans-Desktop-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.rid }}/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FoxTrans-Cli-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.rid }}/cli/${{ matrix.cli_executable }}
